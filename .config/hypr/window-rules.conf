windowrule=match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float true
windowrule=match:class ^(protonvpn)$, float true
windowrule=match:class ^(pavucontrol)$, float true
windowrule=match:class ^(zoom)$, float true
windowrule=match:class zenity, float true
windowrule=match:class blueman-manager, float true

windowrule=match:class ^(wofi)$, no_anim true

windowrule=match:class ^(Microsoft Teams - Preview)$,match:title ^(Microsoft Teams Notification)$, float true
windowrule=match:title ^()$, match:class ^()$, no_blur true

windowrule=match:class ^(Xdg-desktop-portal-gtk)$, no_blur true
windowrule=match:class ^(Xdg-desktop-portal-gtk)$, border_size 0
windowrule=match:class ^(Xdg-desktop-portal-gtk)$, no_shadow true

# no_anim isn't necessary but animations with these rules might look bad. use at your own discretion.
windowrule=match:class ^(flameshot)$, no_anim true
windowrule=match:class ^(flameshot)$, float true
# windowrule=match:class ^(flameshot)$, move true
windowrule=match:class ^(flameshot)$, pin true
# set this to your leftmost monitor id, otherwise you have to move your cursor to the leftmost monitor
# before executing flameshot
windowrule=match:class ^(flameshot)$,monitor 1 

# layerrule=match:namespace gtk-layer-shell, blur true 
layerrule=match:namespace rofi, blur true 
